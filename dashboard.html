<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Bone &amp; Ember</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/png" href="images/logo-icon.png">
</head>
<body>

<header class="admin-nav">
  <span class="admin-nav__logo">
  <img src="images/logo-icon.png" alt="Bone & Ember" class="admin-nav__logo-icon">
  Bone &amp; Ember — Dashboard
</span>
  <nav class="admin-nav__links">
    <a href="#" id="refreshLink">Refresh</a>
  </nav>
  <button id="logoutBtn" class="btn-admin btn-admin--ghost" hidden>Log out</button>
</header>

<!-- Login gate: shown until an artist signs in -->
<section id="loginSection" class="login-section">
  <form id="loginForm" class="login-form">
    <h1>Artist Login</h1>
    <label>
      Email
      <input type="email" id="loginEmail" required>
    </label>
    <label>
      Password
      <input type="password" id="loginPassword" required>
    </label>
    <button type="submit" class="btn-admin btn-admin--primary">Log In</button>
    <p id="loginStatus" class="login-status"></p>
  </form>
</section>

<!-- Dashboard content: shown only once authenticated -->
<main id="dashboardMain" class="dashboard-main" hidden>
  <h1 class="dashboard-title">Booking Requests</h1>
  <p id="requestsStatus" class="requests-status">Loading requests...</p>
  <div id="requestsList" class="requests-list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="./js/emailjs-config.js"></script>
<script type="module" src="./js/firebase-config.js"></script>
<script type="module" src="./js/dashboard.js"></script>
<script type="module" src="./js/firebase-config.js"></script>
<script type="module" src="./js/dashboard.js"></script>
</body>
</html>
